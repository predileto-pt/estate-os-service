# Alembic configuration for the **portal** Postgres database.
# Targets `PORTAL_DATABASE_URL` (see shared.config.Settings.portal_database_url).
# Run via `bash scripts/migrate_portal.sh ...` (the wrapper sets env + this -c).

[alembic]
script_location = %(here)s/alembic-portal

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

prepend_sys_path = . src
path_separator = os

# sqlalchemy.url is set dynamically in alembic-portal/env.py from
# settings.portal_database_url. Do not hardcode here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
