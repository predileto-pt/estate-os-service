[project]
name = "customers-management-service"
version = "0.1.0"
description = "Customer management service - auth, agencies, subscriptions, and notifications"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "supabase>=2.13.0",
    "resend>=2.0.0",
    "structlog>=24.4.0",
    "pyjwt[crypto]>=2.10.0",
    "boto3>=1.35.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aioboto3>=15.5.0",
    "mangum>=0.19.0",
    "openai>=1.0.0",
    "python-multipart>=0.0.9",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "reductoai>=0.16.0",
    "logfire[fastapi,sqlalchemy,httpx]>=3.0.0",
    "langchain>=0.3.0",
    "langfuse>=3.0.0",
    "langgraph>=0.2.0",
    "cryptography>=44.0.0",
    "tabulate>=0.10.0",
    "stripe>=11.0.0",
    "pinecone>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "testcontainers[postgres,localstack]>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared", "src/identity", "src/organizations", "src/properties", "src/screening", "src/listings", "src/bookings", "src/contract_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = ["e2e: end-to-end tests with real Postgres + LocalStack"]

[tool.ruff]
target-version = "py313"
line-length = 100
