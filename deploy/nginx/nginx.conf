# Coolify production nginx — single reverse-proxy server fronting api.
#
# api binds to `expose: ["8000"]` (internal-only); nginx is the only
# port-bound service in the compose. TLS termination happens upstream
# (Coolify Traefik or external LB) — this config speaks plain HTTP
# between the two containers on the compose network.

worker_processes auto;
events {
  worker_connections 1024;
}

http {
  # gzip text + JSON responses. Image / pdf / etc. left uncompressed.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript;

  # Standard structured log format. Coolify reads container stdout.
  log_format upstream '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'upstream=$upstream_addr rt=$request_time uct="$upstream_connect_time" '
                     'urt="$upstream_response_time"';
  access_log /dev/stdout upstream;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # api uploads documents (Reducto OCR pipeline). 20m matches today's
  # operational ceiling — bigger uploads should chunk via presigned-S3
  # URLs, not flow through the api.
  client_max_body_size 20m;

  upstream api_upstream {
    server api:8000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      # Forwarded headers — FastAPI / uvicorn's ProxyHeadersMiddleware
      # reads X-Forwarded-* to reconstruct the original client info.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      # Survive LLM-bound endpoints (property description enhancer,
      # listing semantic search, contract analysis) that can spend
      # 30-45s in OpenAI before responding.
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      # Buffer + retry settings — give the upstream a chance on
      # transient hiccups without holding the client.
      proxy_buffering on;
      proxy_buffer_size 8k;
      proxy_buffers 8 16k;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Direct healthcheck pass-through — same upstream, same path, no
    # added latency. Coolify or upstream LB hits this.
    location = /healthz {
      access_log off;
      proxy_pass http://api_upstream/api/v1/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
