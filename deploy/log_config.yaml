# uvicorn `--log-config` target — Python logging dictConfig.
#
# Wired by Dockerfile.prod and deploy/docker-compose.prod.yml (api service).
# Emits JSON on stdout for both `uvicorn.error` and `uvicorn.access` so the
# Coolify log stream stays parseable alongside the structlog output produced
# by `shared.config.setup_logging`.
#
# The custom formatter classes live in `shared.uvicorn_log` (stdlib-only, no
# python-json-logger dep). Levels default to INFO but the env var
# `UVICORN_LOG_LEVEL` overrides per-deploy without rebuilding the image.

version: 1
disable_existing_loggers: false

formatters:
  json:
    (): shared.uvicorn_log.JsonFormatter
  json_access:
    (): shared.uvicorn_log.JsonAccessFormatter

handlers:
  default:
    class: logging.StreamHandler
    formatter: json
    stream: ext://sys.stdout
  access:
    class: logging.StreamHandler
    formatter: json_access
    stream: ext://sys.stdout

loggers:
  uvicorn:
    handlers: [default]
    level: INFO
    propagate: false
  uvicorn.error:
    level: INFO
  uvicorn.access:
    handlers: [access]
    level: INFO
    propagate: false
