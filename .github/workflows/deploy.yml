name: Deploy to production

# Trigger: push to main. `workflow_dispatch` lets you re-run a deploy
# without an empty commit (e.g. after rotating a Secrets Manager value).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize deploys — never have two redeploys racing on the same EC2.
  # `cancel-in-progress: false` because killing a deploy mid-image-push
  # leaves the registry / target in a half-state.
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write   # required for the OIDC -> IAM federation
  contents: read

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: estate-os-service
  EC2_TAG_NAME: estate-os-service-prod-server
  APP_DIR: /opt/estate-os-service
  # Lambda deploy bucket — direct `--zip-file` uploads cap at ~50 MB;
  # we go via S3 to lift the ceiling to 250 MB unzipped.
  LAMBDA_DEPLOY_BUCKET: estate-os-service-prod-lambda-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # matches the OIDC trust policy's `environment:production` claim
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # The role ARN is provisioned by `terraform/production/github_oidc.tf`.
          # Store the full ARN under `secrets.AWS_GHA_ROLE_ARN` in the
          # `production` environment settings.
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: tag
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          IMAGE_TAG="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${SHA_SHORT}"
          LATEST_TAG="${REGISTRY}/${{ env.ECR_REPOSITORY }}:latest"
          echo "image=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Will push: ${IMAGE_TAG} + ${LATEST_TAG}"

      - name: Build + push Docker image
        run: |
          docker build -t "${{ steps.tag.outputs.image }}" -t "${{ steps.tag.outputs.latest }}" .
          docker push "${{ steps.tag.outputs.image }}"
          docker push "${{ steps.tag.outputs.latest }}"

      - name: Set up Python + uv for Lambda zip build
        # The deps layer needs Linux x86_64 wheels for native packages
        # (asyncpg, cryptography, pydantic-core, etc.). The
        # ubuntu-latest runner is x86_64, so `uv sync` resolves the
        # correct wheels natively — no cross-compilation gymnastics.
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build Lambda deps layer + app zip
        # Layer layout: AWS auto-prepends `/opt/python/lib/python3.13/site-packages`
        # to sys.path when a layer is attached, so we mirror that path
        # inside the zip. Production-only deps (no dev/test). Layer is
        # shared across all three functions.
        #
        # App zip: just `src/` contents at the zip root, so the handler
        # paths (`properties.entrypoints.lambda_extraction.handler`,
        # etc.) resolve correctly.
        run: |
          set -euo pipefail

          uv sync --no-dev

          # --- deps layer ---
          mkdir -p layer/python/lib/python3.13/site-packages
          cp -r .venv/lib/python3.13/site-packages/. layer/python/lib/python3.13/site-packages/
          # Strip cache + tests + dist-info noise to keep under the 250 MB cap.
          find layer -type d -name "__pycache__" -prune -exec rm -rf {} +
          find layer -type d -name "tests" -prune -exec rm -rf {} +
          (cd layer && zip -rq9 ../lambda-deps.zip .)
          echo "Layer zip:  $(du -h lambda-deps.zip | cut -f1)"

          # --- app zip ---
          (cd src && zip -rq9 ../lambda-app.zip .)
          echo "App zip:    $(du -h lambda-app.zip | cut -f1)"

      - name: Upload Lambda zips to S3
        # `--zip-file` direct upload caps at ~50 MB; S3-mediated path
        # raises the ceiling to 250 MB unzipped. The zips live ~7 days
        # (lifecycle rule on the bucket) — we only need the latest
        # version, the older ones are wasted spend.
        id: s3
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA::7}"
          DEPS_KEY="layers/deps-${SHA_SHORT}.zip"
          APP_KEY="functions/app-${SHA_SHORT}.zip"
          aws s3 cp lambda-deps.zip "s3://${LAMBDA_DEPLOY_BUCKET}/${DEPS_KEY}" --region "${AWS_REGION}" --no-progress
          aws s3 cp lambda-app.zip  "s3://${LAMBDA_DEPLOY_BUCKET}/${APP_KEY}"  --region "${AWS_REGION}" --no-progress
          echo "deps_key=${DEPS_KEY}" >> "$GITHUB_OUTPUT"
          echo "app_key=${APP_KEY}"   >> "$GITHUB_OUTPUT"

      - name: Publish Lambda deps layer
        id: layer
        env:
          DEPS_KEY: ${{ steps.s3.outputs.deps_key }}
        run: |
          set -euo pipefail
          LAYER_ARN=$(aws lambda publish-layer-version \
            --layer-name "estate-os-service-prod-deps" \
            --content "S3Bucket=${LAMBDA_DEPLOY_BUCKET},S3Key=${DEPS_KEY}" \
            --compatible-runtimes python3.13 \
            --compatible-architectures x86_64 \
            --description "Deps for ${GITHUB_SHA::7}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'LayerVersionArn' \
            --output text)
          echo "arn=${LAYER_ARN}" >> "$GITHUB_OUTPUT"
          echo "Published: ${LAYER_ARN}"

      - name: Update Lambda worker function code + layer
        # update-function-code reads the zip from S3 (same size-limit
        # rationale as the layer publish step). update-function-
        # configuration points the function at the freshly-published
        # layer. Both calls are eventually consistent; `wait function-
        # updated` between them ensures the next call sees the prior
        # one's effect.
        env:
          LAYER_ARN: ${{ steps.layer.outputs.arn }}
          APP_KEY: ${{ steps.s3.outputs.app_key }}
        run: |
          set -euo pipefail
          FUNCTIONS=(
            "estate-os-service-prod-extraction-worker"
            "estate-os-service-prod-enrichment-worker"
            "estate-os-service-prod-listings-events-worker"
          )
          for fn in "${FUNCTIONS[@]}"; do
            echo "Updating ${fn} code..."
            aws lambda update-function-code \
              --function-name "${fn}" \
              --s3-bucket "${LAMBDA_DEPLOY_BUCKET}" \
              --s3-key "${APP_KEY}" \
              --region "${{ env.AWS_REGION }}" \
              --no-cli-pager > /dev/null

            aws lambda wait function-updated \
              --function-name "${fn}" \
              --region "${{ env.AWS_REGION }}"

            echo "Attaching layer ${LAYER_ARN} to ${fn}..."
            aws lambda update-function-configuration \
              --function-name "${fn}" \
              --layers "${LAYER_ARN}" \
              --region "${{ env.AWS_REGION }}" \
              --no-cli-pager > /dev/null

            aws lambda wait function-updated \
              --function-name "${fn}" \
              --region "${{ env.AWS_REGION }}"
          done
          echo "✅ All three Lambda workers updated (code + layer)."

      - name: Resolve EC2 instance id (by Name tag)
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${{ env.EC2_TAG_NAME }}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text \
            --region "${{ env.AWS_REGION }}")
          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "::error::No running EC2 instance found with Name=${{ env.EC2_TAG_NAME }}"
            exit 1
          fi
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "Found EC2: ${INSTANCE_ID}"

      - name: Run DB migrations + redeploy on EC2 (via SSM)
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          IMAGE_TAG: ${{ steps.tag.outputs.image }}
          LATEST_TAG: ${{ steps.tag.outputs.latest }}
        run: |
          # SSM RunShellScript on the live EC2:
          #   1. Pull the freshly-built image.
          #   2. Run admin + portal alembic migrations in a one-shot container.
          #   3. Replace the running container with `up -d`.
          # Both migrations are idempotent — re-running on no-op is a no-op.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --region "${{ env.AWS_REGION }}" \
            --comment "Deploy ${IMAGE_TAG}" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"cd ${{ env.APP_DIR }}\",
              \"sed -i 's|^ECR_IMAGE=.*|ECR_IMAGE=${LATEST_TAG}|' .env\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $(echo ${LATEST_TAG} | cut -d'/' -f1)\",
              \"docker compose pull\",
              \"docker compose run --rm api bash scripts/migrate_admin.sh upgrade head\",
              \"docker compose run --rm api bash scripts/migrate_portal.sh upgrade head\",
              \"docker compose up -d\",
              \"docker image prune -af --filter 'until=24h'\"
            ]" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command: $COMMAND_ID — polling for completion..."

          # Poll up to 5 minutes for the command to finish.
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "${{ env.AWS_REGION }}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success)
                echo "✅ Deploy succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM command finished with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "${{ env.AWS_REGION }}" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}'
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "::error::SSM command timed out (>5 min)."
          exit 1

      - name: Health check the deployed app
        run: |
          # Hit the ALB once the deploy completes. Retry briefly for the
          # container's start_period (15s in the compose healthcheck).
          ALB_HOST="${{ secrets.ALB_HOST }}"
          if [[ -z "$ALB_HOST" ]]; then
            echo "::warning::ALB_HOST secret not set; skipping live health check."
            exit 0
          fi
          for _ in $(seq 1 12); do
            if curl -fsS -o /dev/null --max-time 5 "https://${ALB_HOST}/api/v1/health"; then
              echo "✅ /api/v1/health returns 2xx"
              exit 0
            fi
            sleep 5
          done
          echo "::error::/api/v1/health did not become healthy within 60s after deploy."
          exit 1
